{% extends 'base.html' %}
{% load my_tags %}
{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Статьи</h1>
    <a href="{% url 'blog:blog_form' %}" class="btn btn-primary">Добавить статью</a>
</div>

<div class="container">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        {% for blog in object_list %}
        <div class="col">
            <div class="card shadow-sm">
                <img src="{{ blog.image | media_filter }}" class="card-img-top" alt="Нет изображения">
                <div class="card-body">
                    <h5 class="card-title">{{ blog.name }}</h5>
                    <p class="card-text">{{ blog.description | truncatechars:100 }}</p>
                    <a href="{% url 'blog:blog_detail' blog.pk %}" class="btn btn-primary">Подробнее</a>
                    {% if user.is_authenticated %}
                    <a href="{% url 'blog:blog_edit' blog.pk %}" class="btn btn-sm btn-secondary ml-3">Редактировать</a>
                    <a href="{% url 'blog:blog_delete' blog.pk %}" class="btn btn-sm btn-danger ml-1">Удалить</a>
                    {% endif %}
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
