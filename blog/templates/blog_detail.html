{% extends 'base.html' %}
{% load my_tags %}
{% block content %}
<div class="container">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        <div class="col">
            <div class="card shadow-sm">
                <img src="{{ blog.image | media_filter }}" class="card-img-top" alt="Нет изображения">
                <div class="card-body">
                    <h5 class="card-title">{{ object.name }}</h5>
                    <p class="card-text">Описание: {{ object.description | truncatechars:100 }}</p>
                    <p class="card-text">Дата создания: {{ object.created_at }}</p>
                    <p class="card-text">Признак публикации: {{ object.is_publication }}</p>
                    <p class="card-text">Количество просмотров: {{ object.counter }}</p>
                    <a href="{% url 'blog:blog_list' %}" class="btn btn-primary">Назад</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
